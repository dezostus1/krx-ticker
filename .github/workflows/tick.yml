# Two self-restarting chains (A, B) on a 10-minute environment wait timer;
# each tick dispatches the target repo's workflows whose time window is open
# (chains.mjs JOBS: some on every tick, some once per window). The target is
# addressed by numeric id; private, so the id resolves only with the token.
# Decisions: chains.mjs. Setup: README.md.

name: tick
run-name: tick ${{ inputs.chain || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      chain:
        description: 'A or B (set by the previous tick); empty = manual start'
        default: ''
      dispatched_at:
        description: 'epoch seconds of the dispatch (set by the previous tick)'
        default: ''
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  actions: write
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: tick-10m
    env:
      GH_TOKEN: ${{ github.token }}
      CHAIN: ${{ inputs.chain }}
      TARGET_REPO_ID: '1363804886'
    steps:
      - name: Guard — the wait timer must exist
        run: |
          prev="${{ inputs.dispatched_at }}"
          if [ -n "$prev" ]; then
            gap=$(( $(date +%s) - prev ))
            echo "chain ${CHAIN:-?}: started ${gap}s after dispatch"
            if [ "$gap" -lt 480 ]; then
              echo "::error::started ${gap}s after dispatch — environment tick-10m has no 10-minute wait timer"
              exit 1
            fi
          fi

      - name: Checkout chains.mjs
        uses: actions/checkout@v5
        with:
          sparse-checkout: chains.mjs
          sparse-checkout-cone-mode: false

      - name: Keep both chains alive
        run: |
          gh run list -R "$GITHUB_REPOSITORY" --workflow tick.yml --limit 80 \
            --json databaseId,status,displayTitle,createdAt > runs.json
          node chains.mjs plan --runs runs.json --me "$GITHUB_RUN_ID" --now "$(date +%s)" > plan.txt
          [ -s plan.txt ] || echo "both chains alive"
          while read -r act arg chain; do
            case "$act" in
              cancel)
                if gh run cancel "$arg" -R "$GITHUB_REPOSITORY"; then echo "chain $chain: cancelled stuck run $arg"
                else echo "::warning::chain $chain: could not cancel stuck run $arg"; fi ;;
              dispatch)
                gh workflow run tick.yml -R "$GITHUB_REPOSITORY" -f chain="$arg" -f dispatched_at="$(date +%s)"
                echo "chain $arg: next tick dispatched" ;;
            esac
          done < plan.txt

      - name: Dispatch what is due
        env:
          POKE_TOKEN: ${{ secrets.POLLER_DISPATCH_TOKEN }}
        run: |
          # Checked on every tick, not only in a window, so a missing secret shows up at once.
          if [ -z "$POKE_TOKEN" ]; then echo "::error::secret POLLER_DISPATCH_TOKEN must be set"; exit 1; fi
          node chains.mjs due --now "$(date +%s)" > due.txt
          if [ ! -s due.txt ]; then echo "$(date -u +%H:%M)Z: nothing due"; exit 0; fi
          if [ "$CHAIN" = B ]; then sleep 90; fi
          failed=0
          while read -r -u 3 job wf since; do
            api="repositories/$TARGET_REPO_ID/actions/workflows/$wf"
            if ! GH_TOKEN="$POKE_TOKEN" gh api "$api/runs?per_page=20" \
                --jq '[.workflow_runs[] | {createdAt: .created_at, displayTitle: .display_title, status: .status, conclusion: .conclusion}]' > target.json; then
              echo "::warning::$job: could not list its runs"; failed=1; continue
            fi
            decision=$(node chains.mjs poke --job "$job" --since "$since" --runs target.json --now "$(date +%s)")
            if [ "$decision" != poke ]; then echo "$job: $decision"; continue; fi
            node chains.mjs body --job "$job" > body.json
            if GH_TOKEN="$POKE_TOKEN" gh api -X POST "$api/dispatches" --input body.json; then
              echo "$job: dispatched (chain ${CHAIN:-none})"
            else
              echo "::warning::$job: dispatch failed"; failed=1
            fi
          done 3< due.txt
          exit $failed

      - name: Weekly heartbeat
        run: |
          # Keeps GitHub from disabling the schedule after 60 days without activity.
          [ "$(TZ=Asia/Seoul date +%u)" = 1 ] || exit 0
          hm=$(TZ=Asia/Seoul date +%H%M); { [ "$hm" -ge 0300 ] && [ "$hm" -lt 0315 ]; } || exit 0
          [ "$CHAIN" = A ] || exit 0
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hb
          cd hb && date -u +%FT%TZ > heartbeat.txt && git add heartbeat.txt
          git -c user.name="krx-ticker" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "heartbeat" && git push -q
